    - "_headers"

website:
  title: "Premier Prediction"
  page-footer:
    left: "© 2026, Robin Penfold. [License and disclaimer](approach.qmd#license-and-disclaimer)" 
  search: false
  favicon: favicon.svg
  navbar:
    left:
      - href: index.qmd
